# Driving structured future-world label configuration.
# This file is deep-merged over the latest LG planner configuration.
# Coordinate convention: x forward, y right, yaw positive right.

# Relative to this YAML file.
base_lg_config: ../../lg_waypoint_planner_project/configs/language_grounded_waypoint.yaml

run:
  input: /home/kemove/ll/simlingo_liulei/database/simlingo_v2_2026_07_21_16_16_03/data/simlingo
  recursive: true
  frame: null
  verbose: true
  raise_on_error: false
  save_log: false

paths:
  # All outputs use Driving-specific folders and do not touch LG labels.
  output_folder: driving_future_interaction_grids
  debug_folder: driving_future_interaction_grids_debug
  actor_selection_output_folder: driving_expert_conditioned_actor_selection

structured_world:
  # Match the route supervision used by current training: 20 points at 1 m.
  reference_route_points: 20
  reference_route_spacing_m: 1.0

  expert_match:
    # The full-scene LG response closest to expert motion is used as the
    # expert-conditioned response for counterfactual actor selection.
    require_allowed_candidate: true
    ade_weight: 1.0
    fde_weight: 0.25
    speed_weight: 0.10

    # A poor match makes the entire four-channel label invalid, because otherwise
    # C2/C4 could describe a strategy that is not consistent with expert driving.
    max_ade_m: 3.0
    max_fde_m: 6.0
    max_speed_mae_mps: 5.0

  secondary_actor:
    enabled: true

    #修改20260727：C4不再直接选择第二高分actor，而要求其具有独立且足够强的
    # 专家条件反事实影响。
    require_causal_accepted: true
    fallback_to_valid_counterfactual_test: false

    # 只保留达到完整物理因果阈值的次要actor，不接受仅凭很小route-follow
    # release效应通过的对象。
    min_causal_score: 0.60

    # 次要actor的因果作用不能相对主要actor过弱。
    min_score_ratio_to_primary: 0.35

    # actor至少需要在未来10帧中的5帧被成功追踪。
    min_future_frames_found: 5

    # actor在某个时间对齐的未来时刻需位于专家轨迹中心10m范围内。
    max_time_aligned_center_distance_m: 10.0

    # 当另一个actor与primary产生完全相同的反事实意图、候选轨迹和作用指标时，
    # 视为重复响应，不再作为独立C4监督。
    reject_duplicate_primary_response: true

    # 多个非主要actor若产生相同的反事实意图、候选变体和作用向量，说明当前证据
    # 无法唯一归因；严格模式下整组拒绝，避免按遍历顺序任意选择C4。
    reject_ambiguous_secondary_response_groups: true
    duplicate_effect_l1_tolerance: 0.0001

  grid:
    reference_route_footprint_margin_m: 0.0
    ego_footprint_margin_m: 0.0
    actor_footprint_margin_m: 0.0

output:
  save_npz: true
  save_invalid_labels: true
  save_actor_selection_json: true

debug:
  save_debug: false
  save_individual_channels: false
  forward_m: 32.0
  rear_m: 6.0
  side_m: 14.0
  panel_width: 320
  panel_gap_px: 12
  panel_border_px: 2
  panel_border_bgr: [160, 160, 160]
  background_bgr: [54, 60, 66]
  show_corner_labels: true
  corner_label_font_scale: 0.45
  corner_label_thickness: 1
  corner_label_outline_thickness: 3
  corner_label_margin_x_px: 8
  corner_label_margin_y_px: 8
  corner_label_text_bgr: [240, 240, 240]
  corner_label_outline_bgr: [35, 35, 35]
