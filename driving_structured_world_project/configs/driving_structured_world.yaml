# Driving structured future-world label configuration; LG critical actor source.
# This file is deep-merged over the latest LG planner configuration.
# Coordinate convention: x forward, y right, yaw positive right.

# Relative to this YAML file.
base_lg_config: ../../lg_waypoint_planner_project/configs/language_grounded_waypoint.yaml

run:
  input: /home/kemove/ll/simlingo_liulei/database/simlingo_v2_2026_07_25_15_05_25/data/simlingo
  recursive: true
  
  frame: null
  verbose: true
  raise_on_error: false
  save_log: false

paths:
  # All outputs use Driving-specific folders and do not touch LG labels.
  output_folder: driving_future_interaction_grids
  debug_folder: driving_future_interaction_grids_debug
  actor_selection_output_folder: driving_expert_conditioned_actor_selection
  lg_folder: language_grounded_waypoints

structured_world:
  # Match the route supervision used by current training: 20 points at 1 m.
  reference_route_points: 20
  reference_route_spacing_m: 1.0

  grid:
    reference_route_footprint_margin_m: 0.0
    ego_footprint_margin_m: 0.0
    actor_footprint_margin_m: 0.0

output:
  save_npz: true
  save_invalid_labels: true
  save_actor_selection_json: true

debug:
  save_debug: false
  save_individual_channels: false
  forward_m: 32.0
  rear_m: 6.0
  side_m: 14.0
  panel_width: 320
  panel_gap_px: 12
  panel_border_px: 2
  panel_border_bgr: [160, 160, 160]
  background_bgr: [54, 60, 66]
  show_corner_labels: true
  corner_label_font_scale: 0.45
  corner_label_thickness: 1
  corner_label_outline_thickness: 3
  corner_label_margin_x_px: 8
  corner_label_margin_y_px: 8
  corner_label_text_bgr: [240, 240, 240]
  corner_label_outline_bgr: [35, 35, 35]
