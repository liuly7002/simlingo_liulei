# @package _global_
defaults:
  - /data_module: carla_bucket_v12_lg    # 这个的含义是调用哪个.yaml文件
  - /model/vision_model: vlm
  - /data_module/base_dataset: dataset

model:
  lr: 3e-5
  predict_route_as_wps: true
  speed_wps_mode: 2d

  #修改20260728：LG与普通Driving共用关键actor六视角投影显式监督。
  # 该变量名为兼容当前训练代码暂时保留，实际监督已不再仅限LG数据。
  use_lg_camera_attention_supervision: true
  lg_camera_attention_loss_weight: 0.05

  #修改20260726：四通道结构化未来世界辅助预测。
  use_future_interaction_prediction: true

  # 第一版网络固定预测128×128。
  future_interaction_output_size: 128

  # 未来世界辅助任务总权重。
  future_interaction_loss_weight: 0.05

  # Dice相对于BCE的权重。
  future_interaction_dice_loss_weight: 1.0

  # C0、C1较密集；C2、C4较稀疏。顺序为C0、C1、C2、C4。
  future_interaction_positive_weights:
    [20.0, 20.0, 80.0, 100.0]

  # 进一步提高稀疏actor通道在辅助任务中的权重。
  future_interaction_channel_weights:
    [1.0, 1.0, 2.0, 4.0]

  language_model:
    variant: '/home/kemove/ll/InternVL2-1B'  # 语言模型的位置
    lora: true
    lora_alpha: 64
    lora_r: 32
    lora_dropout: 0.1
  vision_model:
    variant: '/home/kemove/ll/InternVL2-1B'  # 视觉模型的位置

    # 消融开关：false关闭目标点引导的六视角注意力网络结构。
    use_target_point_camera_attention: true

data_module:
  batch_size: 6
  num_workers: 8

  base_dataset:
    data_path: database/simlingo_v2_2026_07_21_16_16_03
    bucket_path: database/simlingo_v2_2026_07_21_16_16_03/bucketsv2_simlingo
    pred_len: 11
    cut_bottom_quarter: true

    # These remain active for the ordinary driving source. Data_LG constructs
    # its own language and locally disables DriveLM/commentary loading.
    use_commentary: true
    use_qa: true
    qa_augmentation: true

    img_shift_augmentation: true      # 是否进行图像增强(噪声、模糊等,不是几何增强)
    img_shift_augmentation_prob: 0.5
    hist_len: 1

    # 六视角注意力要求每个样本固定包含两个TARGET_POINT。
    route_as: target_point             # none command target_point
    use_lmdrive_commands: false

    use_old_towns: true
    use_town13: true
    use_safety_flag: false

  # LG switches can also be overridden here from the command line, e.g.:
  # data_module.dreamer_dataset.lg_use_language=false
  dreamer_dataset:
    lg_use_language: true
    lg_use_waypoints: true
    lg_language_mode: four_questions

max_epochs: 15          # 最大 epoch
val_every_n_epochs: 2   # 每2轮训练验证一次

gpus: 1
seed: 9876
name: simlingo_lg_tp_attention_structured_world_seed_9876
resume: false

# Local validation records are saved under the current Hydra run directory.
# Set enabled=false to restore SimLingo's original validation output behavior.
validation_logging:
  enabled: true
  output_dir: ./validation_logs
  separate_by_source: true
  save_csv: true
  save_epoch_json: true
  save_per_sample_jsonl: true
  save_visualizations: true
  visualization_samples_per_source: 4
  log_per_horizon_error: true
  waypoint_interval_s: 0.25
  stop_speed_threshold_mps: 0.5
  skip_sanity_check: true
  print_epoch_summary: true

# Required for later closed-loop evaluation. Set false to reproduce the current
# repository behavior that does not save model files.
enable_checkpointing: false
checkpoint_dir: ./checkpoints
checkpoint_filename: '{epoch:03d}'
checkpoint_monitor: val/loss
checkpoint_mode: min
checkpoint_save_top_k: 1
checkpoint_save_last: true

hydra:
  run:
    dir: outputs/${wandb_name}_${name}
