# @package _global_
defaults:
  - /data_module: carla_bucket_v12_lg    # 这个的含义是调用哪个.yaml文件
  - /model/vision_model: vlm
  - /data_module/base_dataset: dataset

model:

  # 修改20261103：在原统一交互网络上增加以决策为中心的预测世界轨迹修正。
  _target_: simlingo_training.models.decision_interaction_driving.DecisionInteractionDrivingModel

  lr: 3e-5

  # 预测 waypoints 相关配置
  predict_route_as_wps: true # 是否预测path(参考路径)
  speed_wps_mode: 2d         # 表示预测自车未来waypoints是预测的二维的点信息,也就是xy

  # 统一决策交互表示：route、ego future、primary actor，保留三个语义 token。
  interaction_attention_dim: 128
  interaction_num_heads: 8
  interaction_dropout: 0.1

  # 第二阶段：Q1-Q4、动作query与统一交互token的一致性监督。
  interaction_alignment_temperature: 0.1
  language_interaction_alignment_loss_weight: 0.05
  action_interaction_alignment_loss_weight: 0.05

  # 修改20261103：初始 Ego 轨迹低权重，修正后的最终 Ego 轨迹为主监督；
  # 全部正样本+按3:1选取可靠负样本，不再使用针对原始低正样本比例的18倍权重。
  initial_ego_waypoints_loss_weight: 0.10
  final_ego_waypoints_loss_weight: 1.0
  critical_actor_existence_loss_weight: 0.05
  critical_actor_positive_weight: 1.0

  # 对主要因果参与者视觉token执行对象移除干预，并进行第二次联合前向。
  use_counterfactual_intervention_training: true
  counterfactual_intervention_probability: 1.0
  counterfactual_intervention_strength: 1.0
  counterfactual_intervention_mask_gamma: 0.5
  counterfactual_language_min_change: 0.02

  # 反事实视觉、动作与未来世界损失；不让删除Actor的场景继续拟合原Q1/Q2。
  counterfactual_visual_suppression_loss_weight: 0.05
  counterfactual_language_consistency_loss_weight: 0.05
  counterfactual_action_target_loss_weight: 0.10
  counterfactual_action_effect_loss_weight: 0.10
  counterfactual_route_invariance_loss_weight: 0.05
  counterfactual_world_primary_removal_loss_weight: 0.05
  counterfactual_world_invariance_loss_weight: 0.02

  # 主要关键参与者六视角视觉token级空间监督。
  use_participant_spatial_attention_supervision: true
  participant_spatial_attention_loss_weight: 0.05

  # 三语义结构化未来世界 C0/C1/C2 + C1/C2 的十帧时序预测。
  use_future_interaction_prediction: true
  future_interaction_output_size: 128
  future_interaction_loss_weight: 0.05
  future_interaction_temporal_loss_weight: 0.03
  future_interaction_dice_loss_weight: 1.0
  future_interaction_positive_weights:
    [20.0, 20.0, 80.0]
  future_interaction_channel_weights:
    [1.0, 1.0, 2.0]

  language_model:
    variant: '/root/autodl-tmp/models/InternVL2-1B'  # 语言模型的位置
    lora: true
    lora_alpha: 64
    lora_r: 32
    lora_dropout: 0.1
  vision_model:
    variant: '/root/autodl-tmp/models/InternVL2-1B'  # 视觉模型的位置

data_module:

  # 修改20261103：保留原 datamodule 行为，并适配当前三通道标签与时序张量。
  _target_: simlingo_training.dataloader.stage2_data.DataModuleStage2

  batch_size: 6
  num_workers: 8

  # 训练样本数量比为正样本:可靠负样本=3:1
  # 全部有效status=1样本每轮各训练一次；从status=0中无放回固定选取约1/3正样本数。
  # status=-1和反事实测试全部无效的不可靠负样本排除，验证集保持原始分布。
  stage2_actor_balanced_sampling: true
  stage2_actor_positive_ratio: 0.75  # 表示最终训练样本集合中正样本所占比例为 75%
  stage2_actor_negative_seed: 9876
  stage2_actor_sampling_cache_dir: outputs/stage2_actor_sampling_cache

  base_dataset:

    data_path: ../database/simlingo_v2_2026_09_12_22_24_28                       # ⚠️ 训练的时候数据集加载的位置,训练前需要修改这里
    bucket_path: ../database/simlingo_v2_2026_09_12_22_24_28/bucketsv2_simlingo  # ⚠️ 训练的时候数据集加载的位置,训练前需要修改这里

    pred_len: 11              # 未来11帧
    cut_bottom_quarter: true  # 是否裁剪图像下方四分之一区域(图像的这部分是车头引擎盖)

    use_commentary: true
    use_qa: true                      # 是否使用VQA
    qa_augmentation: true             # 是否进行VQA增强(随机替换问题、答案)

    img_shift_augmentation: false     # 是否进行图像的几何增强
    img_shift_augmentation_prob: 0.5  # 图像几何增强的概率 几何增强关闭后，该概率不参与实际判断
    hist_len: 1                       # 历史帧长度,1表示不使用历史帧,只使用当前帧,2表示使用当前帧和上一帧,以此类推

    route_as: target_point            # none command target_point
    use_lmdrive_commands: false

    use_old_towns: true               # 是否使用旧的城镇数据集,如果为false,则只使用town13数据集
    use_town13: true                  # 是否使用town13数据集,如果为false,则只使用旧的城镇数据集
    use_safety_flag: false

    use_official_route_split: true    # 是否使用官方的训练集和验证集划分,如果为false,则会随机划分99%训练集和1%验证集 

  # 1.正常情况下lg参与训练的设置
  # dreamer_dataset:
  #   lg_use_language: true
  #   lg_use_waypoints: true
  #   lg_language_mode: four_questions
  # 2. lg不参与训练的设置,此时只有driving数据参与训练
  dreamer_dataset: null

max_epochs: 15          # 最大 epoch
val_every_n_epochs: 1   # 每1轮训练验证一次

gpus: 1
seed: 9876
name: interaction_grounded_counterfactual
resume: false

# Local validation records are saved under the current Hydra run directory.
# Set enabled=false to restore SimLingo's original validation output behavior.
validation_logging:
  enabled: true
  output_dir: ./validation_logs
  separate_by_source: true
  save_csv: true
  save_epoch_json: true
  save_per_sample_jsonl: true
  save_visualizations: true
  visualization_samples_per_source: 4
  log_per_horizon_error: true
  waypoint_interval_s: 0.25
  stop_speed_threshold_mps: 0.5
  skip_sanity_check: true
  print_epoch_summary: true

# Required for later closed-loop evaluation. Set false to reproduce the current
# repository behavior that does not save model files.
enable_checkpointing: false
checkpoint_dir: ./checkpoints
checkpoint_filename: '{epoch:03d}'
checkpoint_monitor: val/loss
checkpoint_mode: min
checkpoint_save_top_k: 1
checkpoint_save_last: true

hydra:
  run:
    dir: outputs/${wandb_name}_${name}
