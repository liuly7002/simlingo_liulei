# @package _global_
defaults:
  - /data_module: carla_bucket_v12_lg    # 这个的含义是调用哪个.yaml文件
  - /model/vision_model: vlm
  - /data_module/base_dataset: dataset

model:
  _target_: simlingo_training.models.driving_interaction.InteractionGroundedDrivingModel

  lr: 3e-5
  predict_route_as_wps: true
  speed_wps_mode: 2d

  # 统一决策交互表示：route、ego future、primary actor、secondary actor。
  interaction_attention_dim: 128
  interaction_num_heads: 8
  interaction_dropout: 0.1

  # 第二阶段：Q1-Q4、动作query与统一交互token的一致性监督。
  interaction_alignment_temperature: 0.1
  language_interaction_alignment_loss_weight: 0.05
  action_interaction_alignment_loss_weight: 0.05

  # 第二阶段：当C4存在次要参与者时，防止主/次参与者token和空间注意力塌缩。
  actor_attention_separation_loss_weight: 0.02
  actor_token_separation_loss_weight: 0.02
  actor_attention_overlap_margin: 0.35
  actor_token_cosine_margin: 0.30

  # 主要关键参与者六视角视觉token级空间监督。
  use_participant_spatial_attention_supervision: true
  participant_spatial_attention_loss_weight: 0.05

  # 是否使用四通道结构化未来世界辅助预测
  use_future_interaction_prediction: true

  # 当前网络固定预测128×128。
  future_interaction_output_size: 128

  # 未来世界辅助任务总权重
  future_interaction_loss_weight: 0.05

  # Dice相对于BCE的权重。
  future_interaction_dice_loss_weight: 1.0

  # C0、C1较密集；C2、C4较稀疏。顺序为C0、C1、C2、C4。
  future_interaction_positive_weights:
    [20.0, 20.0, 80.0, 100.0]

  # 进一步提高稀疏actor通道在辅助任务中的权重。
  future_interaction_channel_weights:
    [1.0, 1.0, 2.0, 4.0]

  language_model:
    variant: '/home/kemove/ll/InternVL2-1B'  # 语言模型的位置
    lora: true
    lora_alpha: 64
    lora_r: 32
    lora_dropout: 0.1
  vision_model:
    variant: '/home/kemove/ll/InternVL2-1B'  # 视觉模型的位置

data_module:

  # 普通Driving和LG统一处理在 datamodule_interaction.py 中实现
  _target_: simlingo_training.dataloader.datamodule_interaction.InteractionDataModule

  batch_size: 6
  num_workers: 8

  base_dataset:

    data_path: database/simlingo_v2_2026_07_25_15_05_25                       # ⚠️ 训练的时候数据集加载的位置
    bucket_path: database/simlingo_v2_2026_07_25_15_05_25/bucketsv2_simlingo  # ⚠️训练的时候数据集加载的位置
    
    pred_len: 11              
    cut_bottom_quarter: true  # 是否裁剪图像下方四分之一区域(图像的这部分是车头引擎盖)

    # These remain active for the ordinary driving source. Data_LG constructs
    # its own language and locally disables DriveLM/commentary loading.
    use_commentary: true
    use_qa: true
    qa_augmentation: true

    img_shift_augmentation: true      # 是否进行图像增强(噪声、模糊等,不是几何增强)
    img_shift_augmentation_prob: 0.5  # 图像曾请的概率
    hist_len: 1                       # 历史帧长度,1表示不使用历史帧,只使用当前帧,2表示使用当前帧和上一帧,以此类推

    route_as: target_point             # none command target_point
    use_lmdrive_commands: false

    use_old_towns: true
    use_town13: true
    use_safety_flag: false

    # 普通Driving和LG统一使用官方route目录划分。
    # train：routes_training
    # val：routes_validation，并使用全部固定Town13验证路线。
    use_official_route_split: true

  # LG switches can also be overridden here from the command line, e.g.:
  # data_module.dreamer_dataset.lg_use_language=false
  dreamer_dataset:
    lg_use_language: true
    lg_use_waypoints: true
    lg_language_mode: four_questions

max_epochs: 15          # 最大 epoch
val_every_n_epochs: 2   # 每2轮训练验证一次

gpus: 1
seed: 9876
name: interaction_grounded_stage2
resume: false

# Local validation records are saved under the current Hydra run directory.
# Set enabled=false to restore SimLingo's original validation output behavior.
validation_logging:
  enabled: true
  output_dir: ./validation_logs
  separate_by_source: true
  save_csv: true
  save_epoch_json: true
  save_per_sample_jsonl: true
  save_visualizations: true
  visualization_samples_per_source: 4
  log_per_horizon_error: true
  waypoint_interval_s: 0.25
  stop_speed_threshold_mps: 0.5
  skip_sanity_check: true
  print_epoch_summary: true

# Required for later closed-loop evaluation. Set false to reproduce the current
# repository behavior that does not save model files.
enable_checkpointing: false
checkpoint_dir: ./checkpoints
checkpoint_filename: '{epoch:03d}'
checkpoint_monitor: val/loss
checkpoint_mode: min
checkpoint_save_top_k: 1
checkpoint_save_last: true

hydra:
  run:
    dir: outputs/${wandb_name}_${name}
