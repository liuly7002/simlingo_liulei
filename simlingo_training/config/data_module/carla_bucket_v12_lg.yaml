#################################################

######       数据集加载的时候的相关配置        ######

#################################################


defaults:
  - driving




_target_: simlingo_training.dataloader.datamodule.DataModule





train_partitions:
  all: 0.082
  acceleration_negative_5: 0.03
  acceleration_negative_1: 0.03
  acceleration_positive_1: 0.03
  acceleration_positive_5: 0.03
  lateral_control_1_2: 0.12
  lateral_control_higher_5: 0.12
  start_from_stop: 0.07
  # vehicle_front: 0.04
  vehicle_side: 0.08
  leading_object_vehicle: 0.09
  leading_object_traffic.stop: 0.07
  changed_route: 0.08




train_partitions_dreamer:
  all: 1.0




############################################### 普通 driving 数据集相关的配置 ###############################################
driving_dataset:

  # driving 数据集相关的内容在 dataset_driving_surround.py 中实现 
  _target_: simlingo_training.dataloader.dataset_driving_surround.Data_Driving_Surround

  # 普通Driving语言类型:
  # four_questions: 与LG相同的Q1-Q4因果语言(当前完整模型)
  # commentary: 原SimLingo commentary语言(语言类型消融)
  # qa: 原DriveLM风格QA语言(语言类型消融)
  # mixed: 保留原来的随机commentary/QA/driving任务
  driving_language_mode: four_questions

  # 普通Driving结构化未来世界监督开关
  driving_use_future_interaction_grid: true                                 # 是否使用四通道结构化世界标签
  driving_future_interaction_grid_folder: driving_future_interaction_grids  # driving数据对应的四通道结构化世界标签的存放文件夹名称

  # 普通Driving主要关键参与者视觉token级空间监督
  driving_use_participant_spatial_attention_supervision: true                             # 是否使用[6,64]软标签监督
  driving_participant_attention_label_folder: driving_expert_conditioned_actor_selection  # [6,64]软标签监督存放文件夹名称



############################################### lg 数据集相关的配置 ###############################################
dreamer_dataset:

  # lg 数据集相关的内容在 dataset_lg_counterfactual.py 中实现
  _target_: simlingo_training.dataloader.dataset_lg_counterfactual.Data_LG_Counterfactual


  use_lg_supervision: true                      # 是否启用 lg 监督
  lg_label_folder: language_grounded_waypoints  # lg 标签存放的文件夹名称


  lg_use_future_interaction_grid: true                         # 是否使用结构化未来世界标签,使用的话会加载到训练里
  lg_future_interaction_grid_folder: future_interaction_grids  # 结构化未来世界标签存放的文件夹名称


  # 是否读取主要关键参与者六视角空间投影并生成6×64视觉token监督
  lg_use_participant_spatial_attention_supervision: true

  # 读取对象移除后重新规划得到的真实反事实waypoints
  lg_use_counterfactual_supervision: true   # 是否使用反事实监督
  lg_counterfactual_min_effect_m: 0.03

  lg_use_language: true  # 是否使用lg语言描述
  lg_use_waypoints: true

  # four_questions, random_question, or none
  lg_language_mode: four_questions  # 语言组织模式(四个问题、随机问题、无语言)
  lg_include_navigation_conditioning: true  # 是否在语言中包含导航条件(两个 target points )

  # Strict filtering keeps the comparison focused on valid generated labels.
  lg_require_risk_label_valid: true  # 滤除在标签生成的时候没有通过安全性和可行性检查的lg waypoints轨迹
  lg_require_four_questions: true    # lg 语言是否要求必须为四个问题(这样可以滤除没有四个问题的lg语言描述)
  lg_skip_expert_fallback: true      # 如果 lg waypoints 轨迹是专家回退的,则滤除该样本
  lg_max_abs_waypoint_m: 100.0       # lg waypoints 和 route 轨迹中最大绝对坐标值超过100米的样本将被滤除
  lg_print_filter_summary: true      # 数据加载的时候是否打印debug信息,主要在simlingo_training/dataloader/dataset_lg.py文件中使用

  # Match the original Dreamer source's official town split.
  lg_match_dreamer_split: true  # 是否使用与Dreamer相同的数据划分,若为相同划分则能够进行公平比较
